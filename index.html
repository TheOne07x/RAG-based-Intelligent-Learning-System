<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcademicRAG</title>
  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --border: #e2e5ea;
      --text: #1a1d23;
      --muted: #6b7280;
      --accent: #4f6ef7;
      --accent-hover: #3b57e0;
      --success: #16a34a;
      --error: #dc2626;
      --tag-bg: #eef2ff;
      --tag-text: #3b54c8;
      --user-bubble: #4f6ef7;
      --ai-bubble: #f1f3f8;
      --radius: 10px;
      --shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header .logo {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.5px;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    header span { font-size: 13px; color: var(--muted); margin-left: 4px; }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px;
      min-width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: #f0f3ff;
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-zone .icon { font-size: 28px; margin-bottom: 8px; }
    .drop-zone p { font-size: 13px; color: var(--muted); }
    .drop-zone strong { color: var(--accent); }

    /* Upload button */
    #uploadBtn {
      width: 100%;
      padding: 9px 16px;
      border-radius: var(--radius);
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #uploadBtn:hover:not(:disabled) { background: var(--accent-hover); }
    #uploadBtn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Status badge */
    .status-badge {
      display: none;
      align-items: center;
      gap: 8px;
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid transparent;
    }
    .status-badge.show { display: flex; }
    .status-badge.success { background: #f0fdf4; border-color: #bbf7d0; color: var(--success); }
    .status-badge.error   { background: #fef2f2; border-color: #fecaca; color: var(--error); }
    .status-badge.loading { background: #f0f3ff; border-color: #c7d2fe; color: var(--accent); }

    /* Uploaded files list */
    .file-list { display: flex; flex-direction: column; gap: 8px; }
    .file-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 13px;
      background: var(--bg);
    }
    .file-item .file-icon { font-size: 18px; flex-shrink: 0; line-height: 1.4; }
    .file-item .file-name { font-weight: 500; word-break: break-all; }
    .file-item .file-meta { color: var(--muted); }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .chat-feed {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      gap: 10px;
      padding: 40px;
    }
    .empty-state .big-icon { font-size: 48px; }
    .empty-state p { font-size: 14px; max-width: 320px; }

    /* Message bubbles */
    .msg-row { display: flex; gap: 10px; max-width: 760px; width: 100%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.assistant { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .msg-row.user .avatar    { background: var(--user-bubble); color: #fff; }
    .msg-row.assistant .avatar { background: #e5e7eb; color: #374151; }

    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      max-width: calc(100% - 44px);
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-top-right-radius: 4px;
    }
    .msg-row.assistant .bubble {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      box-shadow: var(--shadow);
    }

    /* ── Markdown content inside AI bubble ── */
    .bubble .md-body { line-height: 1.7; }
    .bubble .md-body > * + * { margin-top: 0.75em; }

    .bubble .md-body h1,
    .bubble .md-body h2,
    .bubble .md-body h3 {
      font-weight: 700;
      line-height: 1.3;
      margin-top: 1.1em;
      margin-bottom: 0.35em;
      color: var(--text);
    }
    .bubble .md-body h1 { font-size: 1.15em; }
    .bubble .md-body h2 { font-size: 1.05em; }
    .bubble .md-body h3 { font-size: 0.97em; }

    .bubble .md-body ul,
    .bubble .md-body ol {
      padding-left: 1.4em;
      margin: 0.5em 0;
    }
    .bubble .md-body ul { list-style-type: disc; }
    .bubble .md-body ol { list-style-type: decimal; }
    .bubble .md-body li { margin: 0.25em 0; line-height: 1.6; }
    .bubble .md-body li + li { margin-top: 0.15em; }

    .bubble .md-body code {
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 0.875em;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 2px 5px;
      color: #0f172a;
    }
    .bubble .md-body pre {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
      padding: 12px 14px;
      overflow-x: auto;
    }
    .bubble .md-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85em;
    }
    .bubble .md-body strong { font-weight: 700; color: #0f172a; }
    .bubble .md-body em     { font-style: italic; }
    .bubble .md-body p      { margin: 0; }
    .bubble .md-body p + p  { margin-top: 0.65em; }
    .bubble .md-body blockquote {
      border-left: 3px solid var(--border);
      padding-left: 12px;
      color: var(--muted);
      margin: 0.5em 0;
    }
    .bubble .md-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0.75em 0;
    }

    /* ── Sources ── */
    .sources {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .source-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f8faff;
      color: #4a5568;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #dbe4f8;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
      cursor: default;
    }
    .source-tag:hover {
      background: #eef2ff;
      border-color: #b6c6f7;
      color: var(--tag-text);
    }
    .source-tag .src-icon {
      font-size: 11px;
      opacity: 0.7;
    }

    /* Typing indicator */
    .typing { display: flex; align-items: center; gap: 5px; padding: 4px 2px; }
    .typing span {
      width: 7px; height: 7px; background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* ── Input bar ── */
    .input-bar {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 14px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-bar textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.5;
      max-height: 140px;
      overflow-y: auto;
      outline: none;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.2s;
    }
    .input-bar textarea:focus { border-color: var(--accent); }
    .input-bar textarea::placeholder { color: var(--muted); }
    #sendBtn {
      width: 40px; height: 40px; border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #sendBtn:hover:not(:disabled) { background: var(--accent-hover); }
    #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }
    #sendBtn svg { width: 18px; height: 18px; }

    /* Spinner in button */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
      .layout { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">AR</div>
  <h1>AcademicRAG</h1>
  <span>— powered by Gemini 3.8 Flash</span>
</header>

<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <h2>Documents</h2>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".pdf,.docx,.txt" />
      <div class="icon">📄</div>
      <p><strong>Click to browse</strong> or drag & drop</p>
      <p style="margin-top:4px;font-size:12px;">PDF · DOCX · TXT · max 20 MB</p>
    </div>

    <button id="uploadBtn" disabled>Upload document</button>

    <div class="status-badge" id="statusBadge"></div>

    <div class="file-list" id="fileList"></div>
  </aside>

  <!-- ── Chat ── -->
  <section class="chat-area">
    <div class="chat-feed" id="chatFeed">
      <div class="empty-state" id="emptyState">
        <div class="big-icon">🎓</div>
        <strong>Upload a document to get started</strong>
        <p>Then ask any question — answers will be grounded in the document with page-level citations.</p>
      </div>
    </div>

    <div class="input-bar">
      <textarea
        id="questionInput"
        rows="1"
        placeholder="Ask a question about your documents…"
        disabled
      ></textarea>
      <button id="sendBtn" disabled title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </section>

</div>

<script src="/static/app.js"></script>
</body>
</html>
